<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H₂ Flamelet LUT Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }

    header .subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #1a1d27;
      border-right: 1px solid #2a2d3a;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 20px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    select, input[type=range] {
      width: 100%;
    }

    select {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #e0e0e0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    select:focus { outline: none; border-color: #4f6ef7; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type=range] {
      flex: 1;
      accent-color: #4f6ef7;
      cursor: pointer;
    }

    .slider-value {
      font-size: 11px;
      color: #e0e0e0;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      padding: 3px 6px;
      min-width: 44px;
      text-align: center;
    }

    .level-mf {
      font-size: 10px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    /* Level navigation buttons */
    .level-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .level-nav button {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #9ca3af;
      border-radius: 6px;
      padding: 5px 0;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .level-nav button:hover { background: #2a2d3a; color: #fff; }

    /* Stats panel */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-card {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      padding: 8px;
    }

    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
      font-variant-numeric: tabular-nums;
    }

    /* Overlay toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle-label {
      font-size: 11px;
      color: #9ca3af;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2a2d3a;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider { background: #4f6ef7; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* ── Main chart area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chart {
      flex: 1;
      min-height: 0;
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 14px;
    }

    #loading.hidden { display: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2a2d3a;
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text { font-size: 13px; color: #9ca3af; }

    /* colorscale picker */
    .colorscale-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .cs-btn {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #2a2d3a;
      background: #0f1117;
      color: #9ca3af;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cs-btn.active, .cs-btn:hover {
      border-color: #4f6ef7;
      color: #4f6ef7;
    }

    .cs-btn.active { background: #1a1d27; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Loading metadata…</div>
</div>

<header>
  <div>
    <h1>H₂ Flamelet LUT Viewer</h1>
  </div>
  <div class="subtitle" id="header-subtitle"></div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Level selector -->
    <div>
      <div class="section-title">Mixture Fraction Level</div>
      <label>Level index</label>
      <div class="slider-row">
        <input type="range" id="level-slider" min="0" max="49" value="0" step="1" />
        <span class="slider-value" id="level-idx-display">0</span>
      </div>
      <div class="level-mf" id="mf-display">Z = —</div>
      <div class="level-nav">
        <button id="prev-btn">◀ Prev</button>
        <button id="next-btn">Next ▶</button>
      </div>
    </div>

    <!-- Axes -->
    <div>
      <div class="section-title">Axes</div>
      <label>X axis</label>
      <select id="x-var"></select>
      <label>Y axis</label>
      <select id="y-var"></select>
    </div>

    <!-- Color -->
    <div>
      <div class="section-title">Color</div>
      <label>Color variable</label>
      <select id="color-var">
        <option value="__none__">None (uniform)</option>
      </select>
      <label>Color scale</label>
      <div class="colorscale-grid" id="cs-grid"></div>
    </div>

    <!-- Overlay -->
    <div>
      <div class="section-title">Display</div>
      <div class="toggle-row">
        <span class="toggle-label">Show all levels (faint)</span>
        <label class="toggle">
          <input type="checkbox" id="overlay-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <label>Marker size</label>
      <div class="slider-row">
        <input type="range" id="marker-size" min="1" max="10" value="3" step="1" />
        <span class="slider-value" id="marker-size-display">3</span>
      </div>
    </div>

    <!-- Stats -->
    <div>
      <div class="section-title">Statistics (current level)</div>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-label">Points</div><div class="stat-value" id="stat-n">—</div></div>
        <div class="stat-card"><div class="stat-label">X min</div><div class="stat-value" id="stat-xmin">—</div></div>
        <div class="stat-card"><div class="stat-label">X max</div><div class="stat-value" id="stat-xmax">—</div></div>
        <div class="stat-card"><div class="stat-label">Y min</div><div class="stat-value" id="stat-ymin">—</div></div>
        <div class="stat-card"><div class="stat-label">Y max</div><div class="stat-value" id="stat-ymax">—</div></div>
        <div class="stat-card"><div class="stat-label">Y mean</div><div class="stat-value" id="stat-ymean">—</div></div>
      </div>
    </div>

  </div><!-- /sidebar -->

  <!-- Chart -->
  <div class="main">
    <div id="chart"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let meta = null;
let currentLevelIdx = 0;
let levelCache = {};   // idx → parsed JSON
let pendingFetch = null;

const COLORSCALES = ["Viridis", "Plasma", "Inferno", "Magma", "Turbo", "Hot", "RdBu", "Jet"];
let activeCS = "Viridis";

// ── DOM refs ───────────────────────────────────────────────────────────────
const loadingEl    = document.getElementById("loading");
const loadingText  = document.getElementById("loading-text");
const levelSlider  = document.getElementById("level-slider");
const levelIdxDisp = document.getElementById("level-idx-display");
const mfDisplay    = document.getElementById("mf-display");
const xSelect      = document.getElementById("x-var");
const ySelect      = document.getElementById("y-var");
const colorSelect  = document.getElementById("color-var");
const csGrid       = document.getElementById("cs-grid");
const overlayTog   = document.getElementById("overlay-toggle");
const markerSize   = document.getElementById("marker-size");
const markerSizeDi = document.getElementById("marker-size-display");
const prevBtn      = document.getElementById("prev-btn");
const nextBtn      = document.getElementById("next-btn");
const headerSub    = document.getElementById("header-subtitle");

// ── Utilities ──────────────────────────────────────────────────────────────
function fmt(v) {
  if (v === undefined || v === null || isNaN(v)) return "—";
  if (Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-3 && v !== 0))
    return v.toExponential(3);
  return v.toPrecision(5);
}

function arrMin(a) { let m = Infinity; for (const v of a) if (v < m) m = v; return m; }
function arrMax(a) { let m = -Infinity; for (const v of a) if (v > m) m = v; return m; }
function arrMean(a) { let s = 0; for (const v of a) s += v; return s / a.length; }

function setLoading(text) {
  if (text) { loadingEl.classList.remove("hidden"); loadingText.textContent = text; }
  else loadingEl.classList.add("hidden");
}

// ── Fetch level data (with cache) ──────────────────────────────────────────
async function fetchLevel(idx) {
  if (levelCache[idx]) return levelCache[idx];
  const resp = await fetch(`data/level_${String(idx).padStart(2,"0")}.json`);
  if (!resp.ok) throw new Error(`Failed to load level ${idx}`);
  const data = await resp.json();
  levelCache[idx] = data;
  return data;
}

// Pre-fetch adjacent levels silently
function prefetch(idx) {
  [idx - 1, idx + 1].forEach(i => {
    if (i >= 0 && i < meta.n_levels && !levelCache[i]) fetchLevel(i).catch(() => {});
  });
}

// ── Build UI from metadata ─────────────────────────────────────────────────
function buildUI() {
  const vars = meta.var_names;
  const n = meta.n_levels;

  levelSlider.max = n - 1;

  // Populate variable dropdowns
  function fillSelect(sel, defaultVal, includeNone) {
    sel.innerHTML = "";
    if (includeNone) {
      const opt = document.createElement("option");
      opt.value = "__none__"; opt.textContent = "None (uniform)";
      sel.appendChild(opt);
    }
    vars.forEach((v, i) => {
      const opt = document.createElement("option");
      opt.value = i; opt.textContent = v;
      if (v === defaultVal) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  fillSelect(xSelect, "ProgressVariable", false);
  fillSelect(ySelect, "EnthalpyTot", false);

  // Color select
  colorSelect.innerHTML = '<option value="__none__">None (uniform)</option>';
  vars.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = v;
    if (v === "Temperature") opt.selected = true;
    colorSelect.appendChild(opt);
  });

  // Color scale buttons
  csGrid.innerHTML = "";
  COLORSCALES.forEach(cs => {
    const btn = document.createElement("button");
    btn.className = "cs-btn" + (cs === activeCS ? " active" : "");
    btn.textContent = cs;
    btn.onclick = () => {
      activeCS = cs;
      document.querySelectorAll(".cs-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderChart();
    };
    csGrid.appendChild(btn);
  });

  headerSub.textContent = `${n} mixture fraction levels · ${vars.length} variables · ${
    meta.n_points.reduce((a, b) => a + b, 0).toLocaleString()} total points`;
}

// ── Render chart ───────────────────────────────────────────────────────────
async function renderChart() {
  const idx = currentLevelIdx;
  setLoading(`Loading level ${idx + 1} / ${meta.n_levels}…`);

  let levelData;
  try {
    levelData = await fetchLevel(idx);
  } catch (e) {
    setLoading(null);
    alert("Error loading level data: " + e.message);
    return;
  }

  const xVarIdx   = parseInt(xSelect.value);
  const yVarIdx   = parseInt(ySelect.value);
  const colorVal  = colorSelect.value;
  const xName     = meta.var_names[xVarIdx];
  const yName     = meta.var_names[yVarIdx];
  const sz        = parseInt(markerSize.value);
  const showOverlay = overlayTog.checked;

  const xArr = levelData.data[xName];
  const yArr = levelData.data[yName];

  // Build traces
  const traces = [];

  // Overlay: faint background of all cached levels
  if (showOverlay) {
    Object.entries(levelCache).forEach(([i, d]) => {
      if (parseInt(i) === idx) return;
      traces.push({
        type: "scattergl",
        mode: "markers",
        x: d.data[xName],
        y: d.data[yName],
        marker: { size: 2, color: "rgba(255,255,255,0.07)" },
        hoverinfo: "skip",
        showlegend: false,
      });
    });
  }

  // Main scatter
  let markerDef = { size: sz, opacity: 0.85, color: "#4f6ef7" };
  let colorbarLayout = {};

  if (colorVal !== "__none__") {
    const cName  = meta.var_names[parseInt(colorVal)];
    const cArr   = levelData.data[cName];
    markerDef = {
      size: sz,
      opacity: 0.85,
      color: cArr,
      colorscale: activeCS,
      showscale: true,
      colorbar: {
        title: { text: cName, font: { color: "#9ca3af", size: 11 } },
        tickfont: { color: "#9ca3af", size: 10 },
        bgcolor: "#1a1d27",
        bordercolor: "#2a2d3a",
        thickness: 14,
        len: 0.85,
      },
    };
  }

  traces.push({
    type: "scattergl",
    mode: "markers",
    x: xArr,
    y: yArr,
    marker: markerDef,
    name: `Z = ${levelData.mixture_fraction.toExponential(4)}`,
    hovertemplate: `<b>${xName}</b>: %{x:.4g}<br><b>${yName}</b>: %{y:.4g}<extra></extra>`,
  });

  const layout = {
    paper_bgcolor: "#0f1117",
    plot_bgcolor:  "#0f1117",
    margin: { l: 70, r: 20, t: 40, b: 60 },
    font: { color: "#9ca3af", size: 12 },
    xaxis: {
      title: { text: xName, font: { color: "#9ca3af" } },
      gridcolor: "#2a2d3a",
      zerolinecolor: "#3a3d4a",
      tickfont: { color: "#9ca3af" },
    },
    yaxis: {
      title: { text: yName, font: { color: "#9ca3af" } },
      gridcolor: "#2a2d3a",
      zerolinecolor: "#3a3d4a",
      tickfont: { color: "#9ca3af" },
    },
    title: {
      text: `Level ${idx} &nbsp;·&nbsp; Z = ${levelData.mixture_fraction.toExponential(5)} &nbsp;·&nbsp; ${xArr.length.toLocaleString()} points`,
      font: { color: "#e0e0e0", size: 13 },
      x: 0.01,
      xanchor: "left",
    },
    legend: { font: { color: "#9ca3af" }, bgcolor: "rgba(0,0,0,0)" },
    uirevision: `${xVarIdx}-${yVarIdx}`,  // preserve zoom when only color/level changes
  };

  await Plotly.react("chart", traces, layout, {
    responsive: true,
    displaylogo: false,
    modeBarButtonsToRemove: ["lasso2d", "select2d"],
  });

  // Update stats
  document.getElementById("stat-n").textContent = xArr.length.toLocaleString();
  document.getElementById("stat-xmin").textContent = fmt(arrMin(xArr));
  document.getElementById("stat-xmax").textContent = fmt(arrMax(xArr));
  document.getElementById("stat-ymin").textContent = fmt(arrMin(yArr));
  document.getElementById("stat-ymax").textContent = fmt(arrMax(yArr));
  document.getElementById("stat-ymean").textContent = fmt(arrMean(yArr));

  setLoading(null);
  prefetch(idx);
}

// ── Level change ───────────────────────────────────────────────────────────
function setLevel(idx) {
  idx = Math.max(0, Math.min(meta.n_levels - 1, idx));
  currentLevelIdx = idx;
  levelSlider.value = idx;
  levelIdxDisp.textContent = idx;
  mfDisplay.textContent = `Z = ${meta.levels[idx].toExponential(5)}`;
  renderChart();
}

// ── Event listeners ────────────────────────────────────────────────────────
levelSlider.addEventListener("input", () => setLevel(parseInt(levelSlider.value)));
prevBtn.addEventListener("click", () => setLevel(currentLevelIdx - 1));
nextBtn.addEventListener("click", () => setLevel(currentLevelIdx + 1));

xSelect.addEventListener("change", renderChart);
ySelect.addEventListener("change", renderChart);
colorSelect.addEventListener("change", renderChart);
overlayTog.addEventListener("change", renderChart);

markerSize.addEventListener("input", () => {
  markerSizeDi.textContent = markerSize.value;
  renderChart();
});

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setLevel(currentLevelIdx - 1); }
  if (e.key === "ArrowRight" || e.key === "ArrowUp")  { e.preventDefault(); setLevel(currentLevelIdx + 1); }
});

// ── Bootstrap ──────────────────────────────────────────────────────────────
(async () => {
  try {
    setLoading("Loading metadata…");
    const resp = await fetch("data/metadata.json");
    if (!resp.ok) throw new Error("Could not load data/metadata.json — run python preprocess.py first");
    meta = await resp.json();
    buildUI();
    setLevel(0);
  } catch (e) {
    loadingText.textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
